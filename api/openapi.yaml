openapi: 3.1.0

info:
  title: Vista 360° del Estudiante
  version: 1.0.0
  description: |
    Contrato del servicio de matrícula de la Parte 2. Dado el código institucional de un
    estudiante, devuelve las materias del periodo académico vigente con la nota de cada una.
    Los códigos S-NN remiten a `docs/supuestos.md`, donde está el razonamiento de cada decisión.

servers:
  - url: http://localhost:8080
    description: Ejecución local con `./mvnw spring-boot:run`

tags:
  - name: Matrícula
    description: Consulta de la matrícula del periodo vigente

security:
  - bearerAuth: []

paths:
  /api/v1/estudiantes/{estudianteId}/matricula-actual:
    get:
      tags: [Matrícula]
      operationId: obtenerMatriculaActual
      summary: Matrícula del periodo vigente con el estado y la nota de cada materia
      description: |
        Devuelve el conjunto completo del periodo vigente, con las canceladas incluidas y sin
        filtros. "Matriculadas" es ese conjunto e "inscritas actualmente" las que están en
        `INSCRITA` (S-14). Vigente es el periodo que contiene hoy, o el último cursado (S-17).
      parameters:
        - name: estudianteId
          in: path
          required: true
          description: Código institucional del estudiante (S-11).
          schema:
            type: string
            pattern: '^A00\d{6}$'
            examples: ['A00123456']
      responses:
        '200':
          description: |
            Matrícula del periodo vigente. Un estudiante matriculado que todavía no inscribe
            materias responde 200 con `materias` vacía.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatriculaActual'
              examples:
                unPrograma:
                  summary: Un programa, con una cancelada que venía perdiendo
                  value:
                    estudianteId: 'A00123456'
                    periodo: { codigo: '202620', fechaInicio: '2026-07-27', fechaFin: '2026-11-28' }
                    programas:
                      - { codigo: 'TEL', nombre: 'Ingeniería Telemática', principal: true }
                    actualizadoEn: '2026-08-30T04:15:00Z'
                    materias:
                      - asignatura: { codigo: '09780', nombre: 'Ciberseguridad', creditos: 3 }
                        nrc: '11008'
                        grupo: '001'
                        programa: { codigo: 'TEL', nombre: 'Ingeniería Telemática' }
                        docente: 'Ana María Restrepo'
                        estadoInscripcion: 'INSCRITA'
                        escalaCalificacion: 'NUMERICA'
                        estadoCalificacion: 'PARCIAL'
                        nota: 4.2
                        resultado: null
                        fechaCancelacion: null
                      - asignatura: { codigo: '09794', nombre: 'Proyecto integrador II', creditos: 3 }
                        nrc: '11384'
                        grupo: '001'
                        programa: { codigo: 'TEL', nombre: 'Ingeniería Telemática' }
                        docente: 'Carlos Andrés Zapata'
                        estadoInscripcion: 'CANCELADA'
                        escalaCalificacion: 'NUMERICA'
                        estadoCalificacion: 'PARCIAL'
                        nota: 2.1
                        resultado: null
                        fechaCancelacion: '2026-08-21'
                      - asignatura: { codigo: '00101', nombre: 'Programa de desarrollo profesional I', creditos: 0 }
                        nrc: '10387'
                        grupo: '001'
                        programa: { codigo: 'TEL', nombre: 'Ingeniería Telemática' }
                        docente: 'Claudia Patricia Nieto'
                        estadoInscripcion: 'INSCRITA'
                        escalaCalificacion: 'APROBACION'
                        estadoCalificacion: 'DEFINITIVA'
                        nota: null
                        resultado: 'APROBADA'
                        fechaCancelacion: null
                dobleTitulacion:
                  summary: Doble titulación consolidada, con el programa principal marcado
                  value:
                    estudianteId: 'A00987654'
                    periodo: { codigo: '202620', fechaInicio: '2026-07-27', fechaFin: '2026-11-28' }
                    programas:
                      - { codigo: 'TEL', nombre: 'Ingeniería Telemática', principal: true }
                      - { codigo: 'SIS', nombre: 'Ingeniería de Sistemas', principal: false }
                    actualizadoEn: '2026-08-30T04:15:00Z'
                    materias:
                      - asignatura: { codigo: '09783', nombre: 'Sistemas operativos', creditos: 3 }
                        nrc: '10221'
                        grupo: '001'
                        programa: { codigo: 'TEL', nombre: 'Ingeniería Telemática' }
                        docente: 'Felipe Andrés Marín'
                        estadoInscripcion: 'INSCRITA'
                        escalaCalificacion: 'NUMERICA'
                        estadoCalificacion: 'PARCIAL'
                        nota: 3.1
                        resultado: null
                        fechaCancelacion: null
                      - asignatura: { codigo: '06221', nombre: 'Principios de Economía', creditos: 3 }
                        nrc: '10743'
                        grupo: '015'
                        programa: { codigo: 'SIS', nombre: 'Ingeniería de Sistemas' }
                        docente: 'Mónica Alejandra Gil'
                        estadoInscripcion: 'INSCRITA'
                        escalaCalificacion: 'NUMERICA'
                        estadoCalificacion: 'PARCIAL'
                        nota: 2.8
                        resultado: null
                        fechaCancelacion: null
                      - asignatura: { codigo: '07313', nombre: 'Professional communication for an interconnected world IV', creditos: 1 }
                        nrc: '10998'
                        grupo: '013'
                        programa: { codigo: 'TEL', nombre: 'Ingeniería Telemática' }
                        docente: 'Laura Cristina Bedoya'
                        estadoInscripcion: 'INSCRITA'
                        escalaCalificacion: 'APROBACION'
                        estadoCalificacion: 'DEFINITIVA'
                        nota: null
                        resultado: 'REPROBADA'
                        fechaCancelacion: null
                sinInscribir:
                  summary: Matriculado que todavía no inscribe materias
                  value:
                    estudianteId: 'A00555000'
                    periodo: { codigo: '202620', fechaInicio: '2026-07-27', fechaFin: '2026-11-28' }
                    programas:
                      - { codigo: 'TEL', nombre: 'Ingeniería Telemática', principal: true }
                    actualizadoEn: '2026-08-30T04:15:00Z'
                    materias: []
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token emitido por la plataforma de identidad, con el sujeto y el rol de quien consulta
        (S-10, S-18). Se aplica siempre. En local lo emite `GET /dev/token`, que solo existe
        bajo el perfil de desarrollo y en producción no se registra.

  schemas:

    MatriculaActual:
      type: object
      description: |
        Materias del periodo académico vigente con el estado y la nota de cada una. Incluye
        siempre las inscritas y las canceladas (S-14).
      required: [estudianteId, periodo, programas, actualizadoEn, materias]
      properties:
        estudianteId:
          type: string
          pattern: '^A00\d{6}$'
          description: Código institucional del estudiante (S-11).
          examples: ['A00123456']
        periodo:
          $ref: '#/components/schemas/PeriodoAcademico'
        programas:
          type: array
          description: |
            Programas en los que el estudiante está matriculado este periodo. Puede traer uno
            sin inscripciones propias, así que no se deriva de la lista de materias (S-15).
          items:
            $ref: '#/components/schemas/ProgramaMatriculado'
        actualizadoEn:
          type: string
          format: date-time
          description: |
            Instante de la última sincronización. Lo académico es una réplica local alimentada
            por sondeo, no una lectura en vivo del ERP (S-01, S-02).
          examples: ['2026-08-30T04:15:00Z']
        materias:
          type: array
          description: |
            Inscripciones del periodo. Vacía si el estudiante está matriculado pero todavía no
            inscribe materias.
          items:
            $ref: '#/components/schemas/MateriaMatriculada'

    PeriodoAcademico:
      type: object
      description: Periodo académico vigente.
      required: [codigo, fechaInicio, fechaFin]
      properties:
        codigo:
          type: string
          description: Año seguido del número de periodo.
          examples: ['202620']
        fechaInicio:
          type: string
          format: date
          examples: ['2026-07-27']
        fechaFin:
          type: string
          format: date
          examples: ['2026-11-28']

    Asignatura:
      type: object
      description: |
        Datos de la asignatura en el catálogo. No dependen de quién la inscribió: una misma
        asignatura la cursan estudiantes de programas distintos.
      required: [codigo, nombre, creditos]
      properties:
        codigo:
          type: string
          description: Código de la asignatura, cinco dígitos.
          examples: ['09780']
        nombre:
          type: string
          examples: ['Ciberseguridad']
        creditos:
          type: integer
          minimum: 0
          description: Créditos académicos. Hay asignaturas de cero créditos.
          examples: [3]

    Programa:
      type: object
      description: Programa académico bajo el cual se inscribió la asignatura.
      required: [codigo, nombre]
      properties:
        codigo:
          type: string
          examples: ['TEL']
        nombre:
          type: string
          examples: ['Ingeniería Telemática']

    ProgramaMatriculado:
      type: object
      description: |
        Programa de la matrícula del periodo. El principal es sobre el que el ERP calcula
        semestre y promedio, y el que se asume cuando una inscripción no declara programa.
      required: [codigo, nombre, principal]
      properties:
        codigo:
          type: string
          examples: ['TEL']
        nombre:
          type: string
          examples: ['Ingeniería Telemática']
        principal:
          type: boolean
          description: Verdadero en exactamente un programa de la matrícula.
          examples: [true]

    MateriaMatriculada:
      type: object
      description: |
        Una inscripción, no una asignatura. El programa, el NRC, el grupo y los tres ejes de
        estado son atributos de la inscripción y no del catálogo (S-09, S-14, S-15). Las
        invariantes que el servicio garantiza están en `escalaCalificacion` y `resultado`.
      required:
        [asignatura, nrc, grupo, programa, docente, estadoInscripcion, escalaCalificacion,
         estadoCalificacion]
      properties:
        asignatura:
          $ref: '#/components/schemas/Asignatura'
        nrc:
          type: string
          description: |
            Número de referencia del curso. Identifica el grupo de forma única dentro del
            periodo. Ante discrepancia con el grupo, manda el NRC.
          examples: ['11008']
        grupo:
          type: string
          description: |
            Número de grupo que el estudiante ve en su horario. Es etiqueta de presentación y
            no identifica por sí solo.
          examples: ['001']
        programa:
          $ref: '#/components/schemas/Programa'
        docente:
          type: string
          examples: ['Ana María Restrepo']
        estadoInscripcion:
          $ref: '#/components/schemas/EstadoInscripcion'
        escalaCalificacion:
          $ref: '#/components/schemas/EscalaCalificacion'
        estadoCalificacion:
          $ref: '#/components/schemas/EstadoCalificacion'
        nota:
          type: [number, 'null']
          minimum: 0.0
          maximum: 5.0
          multipleOf: 0.01
          description: |
            Nota de 0.0 a 5.0, solo con escala NUMERICA. Presente si y solo si la escala es
            NUMERICA y el estado de calificación no es PENDIENTE.
          examples: [4.2]
        resultado:
          description: |
            Calificación cualitativa, solo con escala APROBACION. Presente si y solo si la
            escala es APROBACION y el estado de calificación es DEFINITIVA.
          oneOf:
            - $ref: '#/components/schemas/ResultadoAprobacion'
            - type: 'null'
        fechaCancelacion:
          type: [string, 'null']
          format: date
          description: |
            Fecha en que se canceló la inscripción. No nula si y solo si el estado de
            inscripción es CANCELADA. La fecha separa una cancelación temprana de una tardía.
          examples: ['2026-08-21']

    EstadoInscripcion:
      type: string
      description: |
        Si la inscripción sigue vigente o fue cancelada. Eje independiente del estado de
        calificación: una cancelada puede traer nota parcial, y esa combinación es la señal de
        alerta temprana (S-14). `INSCRITA` sigue vigente, `CANCELADA` se canceló en el periodo.
      enum: [INSCRITA, CANCELADA]

    EscalaCalificacion:
      type: string
      description: |
        Con qué se califica la asignatura. Se conoce al inscribir, antes de que exista
        calificación, así que con PENDIENTE el cliente ya sabe qué viene (S-16). `NUMERICA`
        da nota de 0.0 a 5.0, `APROBACION` da un resultado cualitativo y nunca nota.
      enum: [NUMERICA, APROBACION]

    ResultadoAprobacion:
      type: string
      description: |
        Calificación de las asignaturas de escala APROBACION, que el balance del ERP muestra
        como aprobado. Esa escala no admite estado de calificación PARCIAL, porque un aprobado
        parcial no significa nada (S-16).
      enum: [APROBADA, REPROBADA]

    EstadoCalificacion:
      type: string
      description: |
        Hasta dónde llegó la calificación. No se deriva de la nota ni del estado de
        inscripción (S-14). `PENDIENTE` sin nota cargada, `PARCIAL` acumulado a la fecha,
        `DEFINITIVA` nota de cierre que ya no cambia.
      enum: [PENDIENTE, PARCIAL, DEFINITIVA]

    ProblemDetail:
      type: object
      description: Detalle de error según RFC 9457, `application/problem+json`.
      properties:
        type:
          type: string
          format: uri
          examples: ['about:blank']
        title:
          type: string
          examples: ['Not Found']
        status:
          type: integer
          examples: [404]
        detail:
          type: string
          examples: ['No existe un estudiante con código A00999999']
        instance:
          type: string
          format: uri
          examples: ['/api/v1/estudiantes/A00999999/matricula-actual']

  responses:

    SolicitudInvalida:
      description: |
        El código institucional no cumple el formato `A00NNNNNN` (S-11). La autorización se
        resuelve antes, así que un código mal formado sobre el que quien consulta no tiene
        permiso responde 403 y no 400.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    NoAutenticado:
      description: |
        Falta el token, está vencido o su firma no valida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    NoAutorizado:
      description: |
        El token es válido y no habilita a consultar a ese estudiante. Cada estudiante se
        consulta a sí mismo y el acompañante solo a los que tiene asignados con vigencia
        abierta (S-05, S-18). Se resuelve antes de mirar si el estudiante existe.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    NoEncontrado:
      description: |
        El código no corresponde a ningún estudiante, o el estudiante no tiene ninguna
        matrícula en ningún periodo. El `detail` distingue los dos casos. El matriculado que
        no ha inscrito materias responde 200 con la lista vacía, no 404.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    ErrorInterno:
      description: Fallo no previsto del servicio.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
