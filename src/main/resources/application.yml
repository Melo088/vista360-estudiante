spring:
  application:
    name: vista360
  datasource:
    url: jdbc:h2:mem:vista360;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  mvc:
    problemdetails:
      enabled: true
